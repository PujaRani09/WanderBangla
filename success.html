
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Booking Successful | WanderBangla</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .success-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            background: #f5f1e8;
        }

        .success-card {
            max-width: 600px;
            width: 100%;
            padding: 55px 35px;
            text-align: center;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        .success-icon {
            width: 85px;
            height: 85px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #dfeadf;
            color: #3d7650;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
        }

        .success-card h1 {
            font-size: 35px;
            color: #17211e;
            margin-bottom: 15px;
        }

        .success-card p {
            color: #68706b;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .success-card a {
            display: inline-block;
            padding: 14px 28px;
            background: #d96b3a;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .success-card a:hover {
            background: #17211e;
        }
    </style>

</head>

<body>

    <main class="success-container">

        <div class="success-card">


            <h1>Booking Successful!</h1>

            <p>
                Thank you for choosing WanderBangla!
                Your booking request has been submitted successfully.
                We appreciate your interest in exploring Bangladesh with us.
            </p>

            <a href="index.html">Back to Home</a>

        </div>

    </main>

</body>

</html>
